services:
  dean:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=256m
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=15)"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
